<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vedetor – Presence, Protection, Peace of Mind</title>
<meta name="description" content="Vedetor helps families stay connected with live location, safe zones, screen time, battery status and alerts.">
<meta name="theme-color" content="#02040a">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#02040a;color:#f7f8fc;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}.hero{height:520vh;position:relative}.pin{position:sticky;top:0;height:100svh;min-height:620px;overflow:hidden;background:#02040a}.video-wrap{position:absolute;inset:0;display:grid;place-items:center}.hero-video{height:100%;width:100%;object-fit:cover;object-position:center;background:#02040a;display:block;transform:translateZ(0)}.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 25%,rgba(2,4,10,.12) 60%,rgba(2,4,10,.58) 100%)}.copy{position:absolute;inset:auto 0 7vh;z-index:2;text-align:center;pointer-events:none;opacity:0;transform:translateY(18px);padding:0 20px}.brand{font-size:clamp(2rem,6vw,4.5rem);font-weight:650;letter-spacing:.22em;margin-left:.22em}.tagline{margin-top:12px;color:rgba(247,248,252,.72);font-size:clamp(.78rem,1.5vw,1rem);letter-spacing:.18em;text-transform:uppercase}.hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:3;color:rgba(255,255,255,.5);font-size:11px;letter-spacing:.18em;text-transform:uppercase;transition:opacity .4s}.progress{position:absolute;right:22px;top:50%;width:2px;height:72px;transform:translateY(-50%);background:rgba(255,255,255,.12);z-index:3}.progress i{display:block;width:100%;height:0;background:rgba(255,255,255,.75);transform-origin:top}.after{min-height:100vh;background:#02040a;padding:16vh 8vw}.after-inner{max-width:1100px;margin:auto}.after h2{font-size:clamp(2rem,5vw,4rem);margin:0 0 20px}.after p{max-width:650px;color:#9da5bb;line-height:1.7}.reduced .hero{height:auto}.reduced .pin{position:relative;height:auto}.reduced .hero-video{height:auto;aspect-ratio:9/16}.reduced .copy{position:relative;inset:auto;padding:60px 20px;opacity:1;transform:none}
@media (min-width:900px){.hero-video{object-fit:contain;width:auto;max-width:100%;background:#02040a}.shade{background:radial-gradient(circle at 50% 45%,transparent 28%,rgba(2,4,10,.25) 72%,rgba(2,4,10,.7) 100%)}}
@media (prefers-reduced-motion:reduce){.hero{height:auto}.pin{position:relative}.hero-video{height:auto;aspect-ratio:9/16}.copy{opacity:1;transform:none;position:relative;inset:auto;padding:60px 20px}}
</style>
</head>
<body>
<main>
<section class="hero" id="hero">
  <div class="pin">
    <div class="video-wrap"><video id="heroVideo" class="hero-video" muted playsinline preload="auto" webkit-playsinline poster="assets/hero/hero-poster.jpg"><source src="assets/hero/vedetor-hero.mp4" type="video/mp4"></video></div>
    <div class="shade"></div>
    <div class="copy" id="copy"><div class="brand">VEDETOR</div><div class="tagline">Presence. Protection. Peace of Mind.</div></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="hint" id="hint">Scroll to explore</div>
  </div>
</section>
<section class="after"><div class="after-inner"><h2>Protection that feels like presence.</h2><p>Stay connected with the people who matter. Vedetor brings live location, safe zones, screen time, battery status and alerts into one calm family experience.</p></div></section>
</main>
<script>
(function(){
  const video=document.getElementById('heroVideo');
  const hero=document.getElementById('hero');
  const copy=document.getElementById('copy');
  const bar=document.getElementById('bar');
  const hint=document.getElementById('hint');
  let target=0, current=0, ready=false, rafId=0;
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced)return;

  function getProgress(){
    const r=hero.getBoundingClientRect();
    const max=hero.offsetHeight-window.innerHeight;
    return clamp(-r.top/Math.max(1,max),0,1);
  }

  function render(){
    current += (target-current)*0.16;
    if(Math.abs(target-current)<0.00015) current=target;
    if(ready && video.duration){
      const t=current*video.duration;
      if(Math.abs(video.currentTime-t)>0.012){
        video.currentTime=t;
      }
    }
    bar.style.height=(current*100)+'%';
    const reveal=clamp((current-.78)/.15,0,1);
    copy.style.opacity=reveal;
    copy.style.transform='translateY('+(18*(1-reveal))+'px)';
    hint.style.opacity=String(1-clamp(current/.08,0,1));
    rafId=requestAnimationFrame(render);
  }

  function onScroll(){target=getProgress();}
  video.addEventListener('loadedmetadata',()=>{ready=true;video.currentTime=0;});
  video.addEventListener('canplay',()=>{ready=true;});
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll,{passive:true});
  onScroll();
  render();
})();
</script>
</body>
</html>
